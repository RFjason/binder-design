name: Validate scientific snapshot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/validate_results.py
      - run: python analyses/20261106-partner-pr-independent-review/scripts/validate_review.py
      - run: python analyses/20261106-partner-pr-independent-review/scripts/recompute.py --local-only
