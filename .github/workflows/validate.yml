name: Validate scientific snapshot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/validate_results.py
      - run: python campaigns/tnfr1-vhh-20261106-scale5000/scripts/validate_plan_local.py
